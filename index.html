<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLK BIO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow:hidden;
}

.bg{
position:fixed;
width:300px;
height:300px;
background:#00ff88;
filter:blur(150px);
opacity:0.2;
border-radius:50%;
top:-100px;
right:-100px;
animation:move 8s infinite alternate;
}

@keyframes move{
0%{transform:translateY(0px);}
100%{transform:translateY(100px);}
}

.card{
width:100%;
max-width:380px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
border-radius:30px;
padding:30px;
text-align:center;
box-shadow:0 0 30px rgba(0,255,136,0.2);
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.profile{
width:110px;
height:110px;
border-radius:50%;
border:3px solid #00ff88;
margin:auto;
object-fit:cover;
box-shadow:0 0 25px #00ff88;
}

h1{
margin-top:20px;
font-size:32px;
color:#00ff88;
}

.bio{
margin-top:10px;
font-size:15px;
color:#aaa;
line-height:1.6;
}

.link{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
padding:16px;
margin-top:18px;
border-radius:18px;
text-decoration:none;
font-size:17px;
font-weight:bold;
color:white;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
}

.link:hover{
transform:scale(1.05);
background:#00ff88;
color:black;
box-shadow:0 0 20px #00ff88;
}

.footer{
margin-top:25px;
font-size:13px;
color:#666;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

<img class="profile" src="https://i.imgur.com/8Km9tLL.png">

<h1>FLK</h1>

<p class="bio">
📸 Photo & Video Creator<br>
🎮 Gamer Lifestyle<br>
⚡ Welcome To My Bio
</p>

</a>

<div class="footer">
FLK WEB © 2026
</div>

</div>

</body>
</html>
