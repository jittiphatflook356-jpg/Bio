<title>FLK x DC</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
padding:20px;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:url('https://i.ibb.co/4ZTcQgKk/file-00000000e3ac720894c40103c34db8fd.jpg') center/cover;
background-size:cover;
background-position:center;
filter:blur(12px) brightness(0.25);
transform:scale(1.1);
z-index:-1;
}

.card{
width:100%;
max-width:360px;
padding:30px;
border-radius:30px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
text-align:center;
box-shadow:0 0 35px rgba(255,0,0,0.3);
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}
}

.profile{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #fff;
box-shadow:0 0 25px red;
margin-bottom:18px;
}

h1{
font-size:34px;
margin-bottom:8px;
}

.bio{
font-size:15px;
color:#ccc;
line-height:1.6;
margin-bottom:20px;
}

.link{
display:flex;
align-items:center;
justify-content:center;
width:100%;
padding:15px;
margin-top:15px;
border-radius:18px;
background:#111;
text-decoration:none;
color:#fff;
font-weight:bold;
font-size:17px;
transition:0.3s;
border:1px solid rgba(255,255,255,0.1);
}

.link:hover{
transform:scale(1.05);
background:red;
box-shadow:0 0 20px red;
}

.footer{
margin-top:25px;
font-size:13px;
color:#888;
}

</style>
</head>

<body>
