<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLK x DC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:url('https://i.ibb.co/4ZTcQgKk/file-00000000e3ac720894c40103c34db8fd.jpg') center/cover;
filter:blur(8px) brightness(0.3);
transform:scale(1.1);
}

.card{
position:relative;
width:350px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
text-align:center;
box-shadow:0 0 30px rgba(255,0,0,0.3);
z-index:1;
animation:fade 1s ease;
}

.profile{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid #fff;
box-shadow:0 0 25px red;
margin-bottom:15px;
}

h1{
font-size:32px;
margin-bottom:5px;
}

p{
color:#ccc;
margin-bottom:20px;
}

.link{
display:block;
text-decoration:none;
background:#111;
padding:14px;
margin:12px 0;
border-radius:15px;
color:#fff;
font-weight:bold;
transition:0.3s;
border:1px solid rgba(255,255,255,0.1);
}

.link:hover{
transform:scale(1.05);
background:red;
box-shadow:0 0 20px red;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

<img class="profile" src="https://i.ibb.co/4ZTcQgKk/file-00000000e3ac720894c40103c34db8fd.jpg">

<h1>FLK x DC</h1>

<p>Photographer • Editor • Gamer</p>

<a class="link" href="https://facebook.com">Facebook</a>

<a class="link" href="https://instagram.com">Instagram</a>

<a class="link" href="https://tiktok.com">TikTok</a>

<a class="link" href="https://youtube.com">YouTube</a>

</div>

</body>
</html>
